services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_ETHERPAD=${VITE_ETHERPAD}
        - VITE_PIXABAY_API_KEY=${VITE_PIXABAY_API_KEY}
        - VITE_UPLOAD_LIMIT=${VITE_UPLOAD_LIMIT}
        - VITE_UPLOAD_FILE_TYPES=${VITE_UPLOAD_FILE_TYPES}
        - VITE_PAD_LIMIT=${VITE_PAD_LIMIT}
        - VITE_PAD_WITHOUT_ACCOUNT=${VITE_PAD_WITHOUT_ACCOUNT}
        - VITE_CREATE_ACCOUNT=${VITE_CREATE_ACCOUNT}
        - VITE_DEFAULT_LANGUAGE=${VITE_DEFAULT_LANGUAGE}
        - VITE_MATOMO=${VITE_MATOMO}
        - VITE_MATOMO_SITE_ID=${VITE_MATOMO_SITE_ID}
        - VITE_STORAGE=${VITE_STORAGE}
        - VITE_S3_PUBLIC_LINK=${VITE_S3_PUBLIC_LINK}
        - VITE_DOCX_VIEWER=${VITE_DOCX_VIEWER}
        - VITE_DOCX_VIEWER_ALT=${VITE_DOCX_VIEWER_ALT}
        - VITE_LEGAL_TERMS_LINK=${VITE_LEGAL_TERMS_LINK}
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=redis
      - DB_PORT=6379
      # Traefik ne sert pas les fichiers statiques depuis le disque (contrairement à nginx) : on laisse donc Express gérer dist/client, /fichiers, /pdfjs et /temp lui-même en désactivant REVERSE_PROXY.
      - REVERSE_PROXY=0
      - NODE_CLUSTER=0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - digipad_fichiers:/app/static/fichiers
      - digipad_temp:/app/static/temp
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.digipad.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.digipad.entrypoints=websecure
      - traefik.http.routers.digipad.tls=true
      - traefik.http.routers.digipad.tls.certresolver=letsencrypt
      - traefik.http.services.digipad.loadbalancer.server.port=3000

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${DB_PWD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DB_PWD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - digipad_redis:/data
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  traefik_letsencrypt:
  digipad_fichiers:
  digipad_temp:
  digipad_redis:
